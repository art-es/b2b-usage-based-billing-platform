syntax = "proto3";

package orgn_service;

option go_package = "internal/generated/grpc/orgn_service";

service OrgnService {
    rpc Get (GetRequest) returns (GetResponse) {}
    rpc GetById (GetByIdRequest) returns (Orgn) {}
}

message GetRequest {
    optional string cursor = 1;
}

message GetResponse {
    repeated Orgn orgns = 1;
    optional string next_cursor = 2;
}

message GetByIdRequest {
    string id = 1;
}

message Orgn {
    string id = 1;
    string name = 2;
    string user_id = 3;
}
