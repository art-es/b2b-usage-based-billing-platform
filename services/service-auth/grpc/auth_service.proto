syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

package auth_service;

option go_package = "internal/generated/grpc/auth_service";

service AuthService {
    rpc Register (RegisterRequest) returns (google.protobuf.Empty) {}
    rpc VerifyEmail (VerifyEmailRequest) returns (google.protobuf.Empty) {}
    rpc ResendEmailVerification (ResendEmailVerificationRequest) returns (google.protobuf.Empty) {}
    rpc Login (LoginRequest) returns (LoginResponse) {}
    rpc RefreshSession (RefreshSessionRequest) returns (RefreshSessionResponse) {}
    rpc GetSessions (GetSessionsRequest) returns (GetSessionsResponse) {}
    rpc FinishAllSessions (google.protobuf.Empty) returns (google.protobuf.Empty) {}
    rpc FinishSession (FinishSessionRequest) returns (google.protobuf.Empty) {}
    rpc SwitchOrgn (SwitchOrgnRequest) returns (google.protobuf.Empty) {}
    rpc GetMe (google.protobuf.Empty) returns (GetMeResponse) {}
}

message RegisterRequest {
    string name = 1;
    string email = 2;
    string password = 3;
}

message VerifyEmailRequest {
    string token = 1;
}

message ResendEmailVerificationRequest {
    string email = 1;
}

message LoginRequest {
    string email = 1;
    string password = 2;
}

message LoginResponse {
    string access_token = 1;
    string refresh_token = 2;
}

message RefreshSessionRequest {
    string token = 1;
}

message RefreshSessionResponse {
    string access_token = 1;
    string refresh_token = 2;
}

message GetSessionsRequest {
    optional string cursor = 1;
}

message GetSessionsResponse {
    repeated Session sessions = 1;
    optional string next_cursor = 2;
}

message Session {
    string id = 1;
    google.protobuf.Timestamp created_at = 2;
}

message FinishSessionRequest {
    string session_id = 1;
}

message SwitchOrgnRequest {
    string orgn_id = 1;
}

message GetMeResponse {
    string session_id = 1;
    string name = 2;
    string email = 3;
    optional GetMeResponseOrgn orgn = 4;
}

message GetMeResponseOrgn {
    string id = 1;
    string name = 2;
}
